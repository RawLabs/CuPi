name: Build portable applications

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: WorkCompanion-Linux-x86_64
          - os: windows-2022
            artifact: WorkCompanion-Windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pyinstaller PyQt6 requests Pillow numpy
      - if: runner.os == 'Linux'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WorkCompanion-Linux-x86_64 --paths . packaging/portable_entry.py
      - if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WorkCompanion-Windows-x64 --paths . packaging/portable_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
