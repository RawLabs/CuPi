name: Build portable applications

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: cupi-Linux-x86_64
          - os: windows-2022
            artifact: cupi-Windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - run: python -m pip install pyinstaller pytest -r requirements.txt

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libegl1

      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          AWC_PORTABLE: "1"

      - if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh
        env:
          PYTHON_BIN: python

      - if: runner.os == 'Windows'
        run: pwsh packaging/build_windows.ps1

      - if: runner.os == 'Linux'
        run: ./dist/cupi-Linux-x86_64/cupi-Linux-x86_64 --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_SESSION_TYPE: wayland

      - if: runner.os == 'Windows'
        run: |
          $process = Start-Process ./dist/cupi-Windows-x64/cupi-Windows-x64.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen smoke test failed: $($process.ExitCode)"
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: releases/${{ matrix.artifact }}.*
          if-no-files-found: error
